name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: bundle install
      - run: bundle exec rubocop

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - name: Install extractor dependencies
        run: pnpm -C tools/extractor install --frozen-lockfile
      - name: Typecheck (tsc --noEmit)
        run: pnpm -C tools/extractor run typecheck
      - name: Unit tests (vitest)
        run: pnpm -C tools/extractor run test

  sorbet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: bundle install
      - name: Static type check
        run: bundle exec srb tc
      - name: RBI freshness (コミット済みRBIがGemfile.lockと乖離していないこと)
        run: |
          bundle exec tapioca gem
          git diff --exit-code -- sorbet/rbi/gems

  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: bundle install
      # 層1(コンポーネント) / 層2(適合試験) / 層4(生成物整合)
      - run: bundle exec rspec spec/components spec/conformance spec/contracts

  system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
      - run: bundle install
      - run: CHROME_BIN=$(which chrome) bundle exec rspec spec/system

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: pnpm -C tools/extractor install --frozen-lockfile
      # 最重要ジョブ(09 §2): 「生成物が手編集された」「パイプラインが非決定論化した」の両方を検知
      - name: Determinism check (byte-identical regeneration)
        run: pnpm -C tools/extractor exec tsx src/cli.ts check
      - name: Working tree must be clean
        run: git diff --exit-code

  tailwind-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: pnpm -C tools/extractor install --frozen-lockfile
      # 契約クラスが実際にTailwind v4ビルドを通るか(06 §6)
      - run: pnpm -C tools/extractor run tailwind:check
