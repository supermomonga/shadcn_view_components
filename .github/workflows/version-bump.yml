name: Version Bump

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version (overrides release_type if set, e.g. 1.2.3)"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump Version & Create PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Bump Version
        id: bump-version
        uses: supermomonga/action-bump-cli@a943766ed866fd8c33faeb65c67e4d5f5b683efd # v1
        with:
          file: lib/shadcn_view_components/version.rb
          pattern: 'VERSION = "(\d+\.\d+\.\d+)"'
          release_type: ${{ inputs.version == '' && inputs.release_type || '' }}
          version: ${{ inputs.version }}

      - name: Update gem versions in lockfiles
        run: |
          bundle lock
          BUNDLE_GEMFILE=gemfiles/minimum.gemfile bundle lock

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: main
          branch: release/v${{ steps.bump-version.outputs.version }}
          add-paths: |
            lib/shadcn_view_components/version.rb
            Gemfile.lock
            gemfiles/minimum.gemfile.lock
          commit-message: "bump version to ${{ steps.bump-version.outputs.version }}"
          title: "Release v${{ steps.bump-version.outputs.version }}"
          body: |
            Bump version to **${{ steps.bump-version.outputs.version }}**.

            Update CHANGELOG.md with the upstream snapshot and API changes, and confirm CI passes before merging.

            This PR was automatically created by the Version Bump workflow.

      # github.tokenで作成したPRにも、通常CIを明示的に起動する。
      - name: Run CI on the release PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --ref "$PR_BRANCH"
