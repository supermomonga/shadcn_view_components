# 週次ドリフト検知 + 自動PR(09-ci-drift-detection §3)。
#
# - 毎週月曜 09:00 JST + 手動dispatch
# - rake shadcn:update でsync+generate
# - 差分があれば全必須検証を実行し、失敗時はPRを作らない
# - PRはgithub.tokenだけで作成し、同じheadへ通常CIをworkflow_dispatchする
#   (GITHUB_TOKENが作ったPRでpull_request eventが抑止される仕様に依存しない)
name: upstream-drift

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync-and-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1

      - name: Install dependencies
        run: |
          bundle install
          pnpm install --frozen-lockfile
          pnpm -C tools/extractor install --frozen-lockfile
          pnpm -C tools/visual-parity install --frozen-lockfile

      - name: rake shadcn:update (sync + generate)
        run: bundle exec rake shadcn:update

      - name: Detect upstream changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture change summaries
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/upstream-sync"
          git status --short --untracked-files=all > "$RUNNER_TEMP/upstream-sync/changes.txt"
          git status --short --untracked-files=all -- gen/contracts > "$RUNNER_TEMP/upstream-sync/contracts.txt"

      - name: Run every required verification
        if: steps.changes.outputs.changed == 'true'
        id: verify
        run: CHROME_BIN="$(command -v chrome)" bundle exec rake verify

      - name: Write the verification summary
        if: always() && steps.changes.outputs.changed == 'true'
        env:
          CHANGES_FILE: ${{ runner.temp }}/upstream-sync/changes.txt
          CONTRACTS_FILE: ${{ runner.temp }}/upstream-sync/contracts.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
        run: ruby .github/scripts/render_upstream_sync_report.rb >> "$GITHUB_STEP_SUMMARY"

      - name: Compose PR body
        if: steps.changes.outputs.changed == 'true'
        env:
          CHANGES_FILE: ${{ runner.temp }}/upstream-sync/changes.txt
          CONTRACTS_FILE: ${{ runner.temp }}/upstream-sync/contracts.txt
          REPORT_OUTPUT: ${{ runner.temp }}/upstream-sync/body.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
        run: ruby .github/scripts/render_upstream_sync_report.rb > "$REPORT_OUTPUT"

      - name: Extract sync metadata for the PR title
        if: steps.changes.outputs.changed == 'true'
        id: meta
        run: |
          tag=$(ruby -rjson -e 'r = JSON.parse(File.read("vendor/shadcn/manifest.json")).fetch("source").fetch("upstream_release"); puts r.fetch("tag")')
          echo "title=chore(upstream): sync shadcn/ui (${tag})" >> "$GITHUB_OUTPUT"

      - name: Create / update the upstream-sync PR
        if: steps.changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # 固定ブランチ = upstream-sync PRは常に1件まで(09 §4)
          branch: chore/upstream-sync
          delete-branch: false
          title: ${{ steps.meta.outputs.title }}
          labels: |
            upstream-sync
            automated
          body-path: ${{ runner.temp }}/upstream-sync/body.md
          # check未作成のPRをmerge可能な状態にしない。更新時も必ずdraftに戻す。
          draft: always-true
          token: ${{ github.token }}

      - name: Require the upstream-sync PR metadata
        if: steps.changes.outputs.changed == 'true'
        env:
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          test -n "$PR_BRANCH"
          test -n "$PR_NUMBER"

      - name: Run normal CI on the upstream-sync PR head
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --ref "$PR_BRANCH"

      - name: Confirm every required CI check exists on the PR head
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          required_checks=(lint-ruby lint-js sorbet rspec system parity determinism tailwind-build)

          for attempt in {1..20}; do
            ci_run_id=$(gh run list --workflow ci.yml --event workflow_dispatch --commit "$PR_HEAD_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -n "$ci_run_id" ]; then
              jobs=$(gh run view "$ci_run_id" --json jobs --jq '.jobs[].name')
              missing=false
              for check in "${required_checks[@]}"; do
                if ! grep -Fqx "$check" <<< "$jobs"; then
                  missing=true
                  break
                fi
              done
              if [ "$missing" = false ]; then
                echo "All required CI checks exist for $PR_HEAD_SHA (run $ci_run_id)"
                exit 0
              fi
            fi
            sleep 6
          done

          echo "::error::Required CI checks were not created for PR head $PR_HEAD_SHA"
          exit 1

      - name: Mark the verified upstream-sync PR ready for review
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Close stale sync PR when upstream is already in sync
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh pr list --head chore/upstream-sync --state open --json number --jq '.[0].number')
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY"
          fi
