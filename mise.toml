[tools]
ruby = "4.0"
node = "lts"
pnpm = "latest"

[tasks.lookbook]
description = "dummy アプリを起動して Lookbook(http://localhost:9292/)を開く"
dir = "spec/dummy"
env = { BUNDLE_GEMFILE = "../../Gemfile" }
run = "bundle exec puma config.ru"

# dummy は Tailwind を実行しない方針(07-testing §2)のため、Lookbook 用の
# スタイルは gem のテーマCSS + コンポーネントのクラスを静的ビルドしてCommitする。
# コンポーネント追加・クラス変更時に実行する
[tasks.build-css]
description = "Lookbook/dummy 用の静的スタイル(spec/dummy/app/assets/stylesheets/application.css)を再生成する"
run = "tools/extractor/node_modules/.bin/tailwindcss -i spec/dummy/tailwind/input.css -o spec/dummy/app/assets/stylesheets/application.css"

# 見た目の upstream パリティ検証(spec/visual)。素の rspec でも常時実行されるが、
# このタスクはハーネスの明示的な再ビルドを伴う
[tasks.parity]
description = "upstream(React/Vite)とdummy(Lookbook)の描画をピクセル比較する(README 開発§参照)"
run = "bundle exec rake parity:run"
