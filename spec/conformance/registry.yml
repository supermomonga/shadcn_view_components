# 適合試験レジストリ(07-testing §3.2)。
# コンポーネント追加時に1行追加するだけで全バリアント組み合わせの適合試験が走る。
# pending: true の項目は vendor にあるが未実装のコンポーネント(負債の見える化 — 07 §6)。
# upstream同期でアイテムが増減した場合、spec/contracts のカバレッジスペックがこのファイルの
# 整合を検証する(新規アイテムの追加漏れ・廃止アイテムの削除忘れを検知)。

