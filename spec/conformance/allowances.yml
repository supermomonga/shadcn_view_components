# 適合から意図的に外れるものの宣言(07-testing §3.4)。
# ネイティブ要素化に伴う属性追加など、本ライブラリの設計由来で契約に無い属性を
# 出力する場合に「追加を許す属性」をコンポーネント単位で明示する(ホワイトリスト)。
# upstream の dynamic_attributes(JSで変化する属性)は元々適合試験の対象外。
#
# class_mode: contains は「契約クラスを全て含む」検証への緩和。upstreamが実行時に
# 別アイテムのクラスを合成する構造(item-separator が Separator をラップする等)で、
# 抽出器が単一アイテム内のクラスしか事前解決できないための措置。
# クラス列の不一致が許容されるケースは原則これのみ。
separator:
  Separator:
    # ネイティブdiv化に伴うARIA(05-stimulus-hotwire §3 の方針)
    attributes: [role, aria-orientation]
item:
  ItemSeparator:
    # upstream は Separator(別アイテム)のクラス + "my-0" を実行時に合成する。
    # 契約(item側)には "my-0" のみ記録されるため、描画は Separator のクラス群を含む
    class_mode: contains
    attributes: [role, aria-orientation]
spinner:
  Spinner:
    # lucide と同等のインラインSVGとして描画するためのSVG属性
    attributes: [xmlns, viewBox, fill, stroke, stroke-width, stroke-linecap, stroke-linejoin, width, height]

checkbox:
  Checkbox:
    # ネイティブinput化に伴う属性(05 §3)
    attributes: [type]
switch:
  Switch:
    attributes: [type, role]
radio-group:
  RadioGroup:
    attributes: [role]
  RadioGroupItem:
    attributes: [type]
toggle:
  Toggle:
    # shadcn--toggle コントローラの状態属性と button 既定の type
    attributes: [data-controller, data-state, data-action, aria-pressed, type]
toggle-group:
  ToggleGroup:
    attributes: [data-controller, data-type, style]
  ToggleGroupItem:
    attributes: [data-state, data-action, aria-pressed, type]
pagination:
  PaginationLink:
    attributes: [href]
  PaginationPrevious:
    # Link(ghost/default)のクラスと Previous 固有クラスの実行時合成(upstreamと同構成)
    class_mode: contains
    attributes: [aria-label, href]
  PaginationNext:
    class_mode: contains
    attributes: [aria-label, href]
tabs:
  Tabs:
    attributes: [data-controller, data-orientation]
  TabsList:
    attributes: [role, aria-orientation]
  TabsTrigger:
    attributes: [role, aria-selected, tabindex, type, data-state, data-value, data-action]
  TabsContent:
    attributes: [role, data-value, hidden]
carousel:
  Carousel:
    # ルートが Context.Provider の内側にある構造。role/aria-roledescription は
    # 契約スロット(carousel div)由来だが、ルートスロット定義は Provider 側になるため許可リストへ
    attributes: [data-controller, role, aria-roledescription]
  CarouselPrevious:
    # Button(outline/icon)のクラスとの実行時合成
    class_mode: contains
    attributes: [type, disabled, data-action, aria-hidden]
  CarouselNext:
    class_mode: contains
    attributes: [type, disabled, data-action, aria-hidden]
form:
  FormLabel:
    attributes: [for, data-error]
  FormControl:
    attributes: [id]
dialog:
  Dialog:
    attributes: [data-controller]
  DialogTrigger:
    attributes: [type, aria-haspopup, aria-expanded, data-action]
  DialogClose:
    attributes: [type, data-action]
  DialogContent:
    attributes: [aria-modal, data-state, data-action]
alert-dialog:
  AlertDialog:
    attributes: [data-controller]
  AlertDialogTrigger:
    attributes: [type, aria-haspopup, aria-expanded, data-action]
  AlertDialogContent:
    # ルートスロットが Portal 側に解決される構造のため、実要素の data-size は許可リストへ
    attributes: [role, aria-modal, data-state, data-size]
  AlertDialogAction:
    class_mode: contains
    attributes: [type, data-action, data-state, aria-haspopup]
  AlertDialogCancel:
    class_mode: contains
    attributes: [type, data-action, data-state, aria-haspopup]
sheet:
  Sheet:
    attributes: [data-controller]
  SheetTrigger:
    attributes: [type, aria-haspopup, aria-expanded, data-action]
  SheetClose:
    attributes: [type, data-action]
  SheetContent:
    attributes: [aria-modal, data-state]
drawer:
  Drawer:
    attributes: [data-controller]
  DrawerTrigger:
    attributes: [type, aria-haspopup, aria-expanded, data-action]
  DrawerClose:
    attributes: [type, data-action]
  DrawerContent:
    attributes: [aria-modal, data-state, data-vaul-drawer-direction]
popover:
  Popover:
    attributes: [data-controller]
  PopoverTrigger:
    attributes: [type, aria-expanded, aria-haspopup, data-action]
  PopoverContent:
    attributes: [popover, data-state, data-side-offset, style]
hover-card:
  HoverCard:
    attributes: [data-controller]
  HoverCardTrigger:
    attributes: [data-action]
  HoverCardContent:
    attributes: [hidden, data-state, data-action, style]
tooltip:
  Tooltip:
    attributes: [data-controller]
  TooltipProvider:
    attributes: []
  TooltipTrigger:
    attributes: [data-action, aria-describedby]
  TooltipContent:
    attributes: [role, hidden, data-state]
dropdown-menu:
  DropdownMenu:
    attributes: [data-controller]
  DropdownMenuTrigger:
    attributes: [type, aria-haspopup, aria-expanded, data-action]
  DropdownMenuContent:
    attributes: [role, popover, tabindex, data-state, style]
  DropdownMenuGroup:
    attributes: [role]
  DropdownMenuItem:
    attributes: [role, tabindex, data-action, data-highlighted]
  DropdownMenuCheckboxItem:
    attributes: [role, tabindex, data-action, data-highlighted, aria-checked]
  DropdownMenuRadioGroup:
    attributes: [role]
  DropdownMenuRadioItem:
    attributes: [role, tabindex, data-action, data-highlighted, aria-checked]
  DropdownMenuSubTrigger:
    attributes: [role, tabindex, data-action, data-highlighted, aria-haspopup, aria-expanded]
  DropdownMenuSubContent:
    attributes: [role, popover, tabindex, data-state, style]
context-menu:
  ContextMenu:
    attributes: [data-controller]
  ContextMenuTrigger:
    attributes: [data-action]
  ContextMenuContent:
    attributes: [role, popover, tabindex, data-state, style]
  ContextMenuGroup:
    attributes: [role]
  ContextMenuItem:
    attributes: [role, tabindex, data-action, data-highlighted]
  ContextMenuCheckboxItem:
    attributes: [role, tabindex, data-action, data-highlighted, aria-checked]
  ContextMenuRadioGroup:
    attributes: [role]
  ContextMenuRadioItem:
    attributes: [role, tabindex, data-action, data-highlighted, aria-checked]
  ContextMenuSubTrigger:
    attributes: [role, tabindex, data-action, data-highlighted, aria-haspopup, aria-expanded]
  ContextMenuSubContent:
    attributes: [role, popover, tabindex, data-state, style]
resizable:
  ResizablePanelGroup:
    attributes: [role, style, data-controller]
  ResizablePanel:
    attributes: [style]
  ResizableHandle:
    attributes: [role, tabindex, style, aria-orientation, data-action]
menubar:
  Menubar:
    attributes: [data-controller]
  MenubarTrigger:
    attributes: [type, aria-haspopup, aria-expanded, data-action]
  MenubarContent:
    attributes: [role, popover, tabindex, data-state, style]
  MenubarGroup:
    attributes: [role]
  MenubarItem:
    attributes: [role, tabindex, data-action, data-highlighted]
  MenubarCheckboxItem:
    attributes: [role, tabindex, data-action, data-highlighted, aria-checked]
  MenubarRadioGroup:
    attributes: [role]
  MenubarRadioItem:
    attributes: [role, tabindex, data-action, data-highlighted, aria-checked]
  MenubarSubTrigger:
    attributes: [role, tabindex, data-action, data-highlighted, aria-haspopup, aria-expanded]
  MenubarSubContent:
    attributes: [role, popover, tabindex, data-state, style]
navigation-menu:
  NavigationMenu:
    attributes: [data-controller]
  NavigationMenuTrigger:
    attributes: [type, aria-haspopup, aria-expanded, data-action]
  NavigationMenuContent:
    attributes: [popover, data-state]
command:
  Command:
    attributes: [data-controller]
  CommandDialog:
    # Dialog合成: 契約スロットは無いが、子のdialog/commandスロットが現れる
    slots_mode: superset
    attributes: [data-controller]
  CommandInput:
    attributes: [type, aria-label, data-action]
  CommandItem:
    attributes: [role, tabindex, data-value, data-selected, aria-selected, data-action]
  CommandEmpty:
    attributes: [hidden]
combobox:
  ComboboxInput:
    attributes: [type, role, aria-expanded, aria-haspopup, data-action]
  ComboboxTrigger:
    attributes: [type, data-action, aria-label]
  ComboboxContent:
    attributes: [role, popover, data-state]
  ComboboxItem:
    attributes: [role, tabindex, data-value, data-selected, aria-selected]
  ComboboxEmpty:
    attributes: [hidden]
  ComboboxChipsInput:
    attributes: [type]
  ComboboxChip:
    attributes: [aria-label]
progress:
  Progress:
    attributes: [role, aria-valuenow, aria-valuemin, aria-valuemax, style]
slider:
  Slider:
    attributes: [role]
native-select:
  NativeSelect:
    # フォーム属性は利用者が <select> に渡す(name/required 等)
    attributes: [name, id, required, disabled, multiple, form, autofocus, aria-label]
input-otp:
  InputOTP:
    attributes: [type, inputmode, maxlength, autocomplete, value]
select:
  Select:
    attributes: [data-controller]
  SelectTrigger:
    attributes: [type, role, aria-haspopup, aria-expanded, data-action]
  SelectContent:
    attributes: [role, popover, data-state, style]
  SelectItem:
    attributes: [role, tabindex, data-value, aria-selected]
field:
  FieldLabel:
    attributes: [for]
input-group:
  InputGroupButton:
    class_mode: contains
    attributes: [type, data-size, data-action, data-state, aria-haspopup]
button-group:
  ButtonGroupSeparator:
    class_mode: contains
    attributes: [role, aria-orientation, data-slot]
direction:
  DirectionProvider:
    attributes: [dir]
sidebar:
  Sidebar:
    attributes: [data-state]
  SidebarProvider:
    attributes: [data-controller, data-state]
  SidebarTrigger:
    attributes: [type, aria-expanded, aria-label, data-action]
  SidebarRail:
    attributes: [type, tabindex, aria-label, data-action]
  SidebarInput:
    class_mode: contains
    attributes: [type, data-action, aria-invalid]
  SidebarSeparator:
    class_mode: contains
    attributes: [role, aria-orientation, data-slot, data-sidebar, data-orientation]
  SidebarMenuButton:
    attributes: [type, data-active, aria-haspopup, aria-expanded, data-action]
  SidebarMenuSkeleton:
    # 内側に Skeleton(別アイテム)を描くため子スロットが増える
    slots_mode: superset
    attributes: [data-sidebar]
  SidebarMenuAction:
    attributes: [type, aria-label, data-action]
  SidebarMenuSubButton:
    attributes: [data-active, aria-haspopup, aria-expanded]
attachment:
  AttachmentAction:
    attributes: [type, aria-label, data-action]
  AttachmentTrigger:
    attributes: [type, aria-label, data-action]
bubble:
  Bubble: {}
message: {}
message-scroller:
  MessageScroller:
    attributes: [data-controller]
  MessageScrollerViewport:
    attributes: [tabindex]
  MessageScrollerButton:
    attributes: [type, hidden, data-action]
chart:
  ChartContainer:
    attributes: []
sonner:
  Toaster:
    attributes: [data-controller, aria-live]
calendar:
  Calendar:
    # 内側に DayButton を描く合成構造のため子スロットが増える
    slots_mode: superset
    attributes: []
  CalendarDayButton:
    attributes: [type, tabindex, data-day, data-selected-single, data-today, data-outside]
