# 適合から意図的に外れるものの宣言(07-testing §3.4)。
# ネイティブ要素化に伴う属性追加など、本ライブラリの設計由来で契約に無い属性を
# 出力する場合に「追加を許す属性」をコンポーネント単位で明示する(ホワイトリスト)。
# upstream の dynamic_attributes(JSで変化する属性)は元々適合試験の対象外。
#
# class_mode: contains は「契約クラスを全て含む」検証への緩和。upstreamが実行時に
# 別アイテムのクラスを合成する構造(item-separator が Separator をラップする等)で、
# 抽出器が単一アイテム内のクラスしか事前解決できないための措置。
# クラス列の不一致が許容されるケースは原則これのみ。
separator:
  Separator:
    # ネイティブdiv化に伴うARIA(05-stimulus-hotwire §3 の方針)
    attributes: [role, aria-orientation]
item:
  Item:
    # upstream useRender の state(variant/size)は data-variant / data-size として出る
    attributes: [data-variant, data-size]
  ItemMedia:
    attributes: [data-variant]
  ItemSeparator:
    # upstream は Separator(別アイテム)のクラス + "my-0" を実行時に合成する。
    # 契約(item側)には "my-0" のみ記録されるため、描画は Separator のクラス群を含む
    class_mode: contains
    attributes: [role, aria-orientation]
spinner:
  Spinner:
    # lucide と同等のインラインSVGとして描画するためのSVG属性
    attributes: [xmlns, viewBox, fill, stroke, stroke-width, stroke-linecap, stroke-linejoin, width, height]

checkbox:
  Checkbox:
    # ネイティブinput化に伴う属性(05 §3)。data-checked / data-unchecked は契約の
    # data-checked: クラスを素のinputでも発火させるための同期属性(unchecked は
    # 契約がunchecked側の属性を記録しないため許可)、appearance-none はネイティブ
    # ウィジェット描画を消す装飾(dark時の白箱問題)
    class_mode: contains
    attributes: [type, data-checked, data-unchecked, data-controller, data-action]
switch:
  Switch:
    # checkbox と同じ理由の data-checked / data-unchecked / appearance-none
    # (peer-checked のための peer 含む)
    class_mode: contains
    attributes: [type, role, data-checked, data-unchecked, data-controller, data-action]
radio-group:
  RadioGroup:
    attributes: [role]
  RadioGroupItem:
    # checkbox と同じ理由の data-checked / data-unchecked / appearance-none / peer
    class_mode: contains
    attributes: [type, data-checked, data-unchecked, data-controller, data-action]
toggle:
  Toggle:
    # shadcn--toggle コントローラの状態属性と button 既定の type
    attributes: [data-controller, data-state, data-action, aria-pressed, type]
toggle-group:
  ToggleGroup:
    attributes: [data-controller, data-type, style]
  ToggleGroupItem:
    attributes: [data-state, data-action, aria-pressed, type]
pagination:
  PaginationLink:
    # base-nova は Button装飾(variant/size)をrender propで合成するため契約クラスは空。
    # 描画側はButton契約からクラスを合成する
    class_mode: contains
    attributes: [href, data-active, data-slot]
  PaginationPrevious:
    # Link(ghost/default)のクラスと Previous 固有クラスの実行時合成(upstreamと同構成)。
    # 契約は無名スロットのみのため実DOMの data-slot も許可する
    class_mode: contains
    slots_mode: superset
    attributes: [aria-label, href, data-active, data-slot]
  PaginationNext:
    class_mode: contains
    slots_mode: superset
    attributes: [aria-label, href, data-active, data-slot]
tabs:
  Tabs:
    attributes: [id, data-controller, data-orientation, data-shadcn-generated-root-id]
  TabsList:
    attributes: [role, aria-orientation]
  TabsTrigger:
    attributes: [role, aria-selected, tabindex, type, data-state, data-value, data-action]
  TabsContent:
    attributes: [role, data-value, hidden]
carousel:
  Carousel:
    # ルートが Context.Provider の内側にある構造。role/aria-roledescription は
    # 契約スロット(carousel div)由来だが、ルートスロット定義は Provider 側になるため許可リストへ
    class_mode: contains
    attributes:
      [id, data-controller, data-action, data-orientation, data-direction, dir, tabindex,
       data-shadcn-generated-root-id, role, aria-roledescription]
  CarouselContent:
    # React Contextのorientationをnamed group variantで再現する追加クラス
    class_mode: contains
  CarouselItem:
    class_mode: contains
  CarouselPrevious:
    # Button(outline/icon)のクラスとの実行時合成
    class_mode: contains
    attributes: [type, disabled, data-action, aria-hidden]
  CarouselNext:
    class_mode: contains
    attributes: [type, disabled, data-action, aria-hidden]
dialog:
  Dialog:
    attributes: [id, data-controller, data-shadcn-generated-root-id]
  DialogTrigger:
    attributes: [type, aria-haspopup, aria-expanded, data-action]
  DialogClose:
    attributes: [type, data-action]
  DialogContent:
    attributes: [aria-modal, data-state, data-action]
alert-dialog:
  AlertDialog:
    attributes: [id, data-controller, data-shadcn-generated-root-id]
  AlertDialogTrigger:
    attributes: [type, aria-haspopup, aria-expanded, data-action]
  AlertDialogContent:
    # ルートスロットが Portal 側に解決される構造のため、実要素の data-size は許可リストへ
    attributes: [role, aria-modal, data-state, data-size]
  AlertDialogAction:
    class_mode: contains
    attributes: [type, data-action, data-state, aria-haspopup]
  AlertDialogCancel:
    class_mode: contains
    attributes: [type, data-action, data-state, aria-haspopup]
sheet:
  Sheet:
    attributes: [id, data-controller, data-shadcn-generated-root-id]
  SheetTrigger:
    attributes: [type, aria-haspopup, aria-expanded, data-action]
  SheetClose:
    attributes: [type, data-action]
  SheetContent:
    attributes: [aria-modal, data-state]
drawer:
  Drawer:
    attributes: [id, data-controller, data-slot, data-shadcn-generated-root-id]
  DrawerTrigger:
    attributes: [type, aria-haspopup, aria-expanded, data-action]
  DrawerClose:
    attributes: [type, data-action]
  DrawerContent:
    attributes: [aria-modal, data-state, data-vaul-drawer-direction]
popover:
  Popover:
    attributes: [data-controller]
  PopoverTrigger:
    attributes: [type, aria-expanded, aria-haspopup, data-action]
  PopoverContent:
    attributes: [popover, data-state, data-position-side, data-position-align, data-position-side-offset, data-position-align-offset, data-position-collision-padding, style]
hover-card:
  HoverCard:
    attributes: [data-controller]
  HoverCardTrigger:
    attributes: [data-action]
  HoverCardContent:
    attributes: [hidden, data-state, data-action, data-position-side, data-position-align, data-position-side-offset, data-position-align-offset, data-position-collision-padding, style]
tooltip:
  Tooltip:
    attributes: [data-controller]
  TooltipProvider:
    attributes: []
  TooltipTrigger:
    # button 要素として描くための type 属性(他トリガーと同じ)
    attributes: [data-action, aria-describedby, type]
  TooltipContent:
    attributes: [role, hidden, data-state, data-position-side, data-position-align, data-position-side-offset, data-position-align-offset, data-position-collision-padding]
dropdown-menu:
  DropdownMenu:
    attributes: [data-controller]
  DropdownMenuTrigger:
    attributes: [type, aria-haspopup, aria-expanded, data-action]
  DropdownMenuContent:
    attributes: [role, popover, tabindex, data-state, data-position-side, data-position-align, data-position-side-offset, data-position-align-offset, data-position-collision-padding, style]
  DropdownMenuGroup:
    attributes: [role]
  DropdownMenuItem:
    attributes: [role, tabindex, data-action, data-highlighted]
  DropdownMenuCheckboxItem:
    attributes: [role, tabindex, data-action, data-highlighted, aria-checked]
  DropdownMenuRadioGroup:
    attributes: [role]
  DropdownMenuRadioItem:
    attributes: [role, tabindex, data-action, data-highlighted, aria-checked]
  DropdownMenuSubTrigger:
    attributes: [role, tabindex, data-action, data-highlighted, aria-haspopup, aria-expanded]
  DropdownMenuSubContent:
    attributes: [role, popover, tabindex, data-state, data-position-side, data-position-align, data-position-side-offset, data-position-align-offset, data-position-collision-padding, style]
context-menu:
  ContextMenu:
    attributes: [data-controller]
  ContextMenuTrigger:
    attributes: [tabindex, aria-haspopup, data-action]
  ContextMenuContent:
    attributes: [role, popover, tabindex, data-state, data-position-side, data-position-align, data-position-side-offset, data-position-align-offset, data-position-collision-padding, style]
  ContextMenuGroup:
    attributes: [role]
  ContextMenuItem:
    attributes: [role, tabindex, data-action, data-highlighted]
  ContextMenuCheckboxItem:
    attributes: [role, tabindex, data-action, data-highlighted, aria-checked]
  ContextMenuRadioGroup:
    attributes: [role]
  ContextMenuRadioItem:
    attributes: [role, tabindex, data-action, data-highlighted, aria-checked]
  ContextMenuSubTrigger:
    attributes: [role, tabindex, data-action, data-highlighted, aria-haspopup, aria-expanded]
  ContextMenuSubContent:
    attributes: [role, popover, tabindex, data-state, data-position-side, data-position-align, data-position-side-offset, data-position-align-offset, data-position-collision-padding, style]
resizable:
  ResizablePanelGroup:
    attributes: [id, role, style, data-controller, data-orientation, data-shadcn-generated-root-id]
  ResizablePanel:
    attributes: [style]
  ResizableHandle:
    attributes: [role, tabindex, style, aria-orientation, aria-valuemin, aria-valuemax, aria-valuenow, data-action]
menubar:
  Menubar:
    attributes: [data-controller, role, aria-orientation]
  MenubarMenu:
    attributes: [role]
  MenubarTrigger:
    attributes: [type, role, aria-haspopup, aria-expanded, data-action]
  MenubarContent:
    attributes: [role, popover, tabindex, data-state, data-position-side, data-position-align, data-position-side-offset, data-position-align-offset, data-position-collision-padding, style]
  MenubarGroup:
    attributes: [role]
  MenubarItem:
    attributes: [role, tabindex, data-action, data-highlighted]
  MenubarCheckboxItem:
    attributes: [role, tabindex, data-action, data-highlighted, aria-checked]
  MenubarRadioGroup:
    attributes: [role]
  MenubarRadioItem:
    attributes: [role, tabindex, data-action, data-highlighted, aria-checked]
  MenubarSubTrigger:
    attributes: [role, tabindex, data-action, data-highlighted, aria-haspopup, aria-expanded]
  MenubarSubContent:
    attributes: [role, popover, tabindex, data-state, data-position-side, data-position-align, data-position-side-offset, data-position-align-offset, data-position-collision-padding, style]
navigation-menu:
  NavigationMenu:
    attributes: [data-controller]
  NavigationMenuTrigger:
    attributes: [type, aria-expanded, data-action]
  NavigationMenuContent:
    attributes: [popover, data-state, data-position-side, data-position-align, data-position-side-offset, data-position-align-offset, data-position-collision-padding]
command:
  Command:
    attributes: [data-controller]
  CommandDialog:
    # Dialog合成: 契約スロットは無いが、子のdialog/commandスロットが現れる
    slots_mode: superset
    attributes: [data-controller]
  CommandInput:
    # upstream の CommandInput は <InputGroup>(別アイテム)でラップし、検索アイコンを
    # <InputGroupAddon align="inline-start"> に置く。契約(command側)には
    # wrapper/input のスロットのみ記録されるため、input-group 由来の slot は superset
    slots_mode: superset
    attributes: [type, placeholder, autocomplete, aria-label, data-action]
  CommandItem:
    attributes: [role, tabindex, data-value, data-selected, aria-selected, data-action]
  CommandEmpty:
    attributes: [hidden]
combobox:
  Combobox:
    # primitive Root内部のform controlをRails側ではSSRする
    slots_mode: superset
    attributes: [id, data-controller, data-shadcn-generated-root-id]
  ComboboxInput:
    # upstream の ComboboxInput は <InputGroup>(別アイテム)でラップし、トリガーを
    # <InputGroupAddon> に置く。契約(combobox側)には上書き分のみ記録されるため、
    # 描画は input-group のクラス群と addon スロットを含む
    class_mode: contains
    slots_mode: superset
    attributes: [type, role, aria-expanded, aria-haspopup, data-action]
  ComboboxTrigger:
    attributes: [type, data-action, aria-label, aria-haspopup, aria-expanded]
  ComboboxContent:
    attributes: [role, popover, data-state]
  ComboboxItem:
    # クリックでの選択確定のための Stimulus アクション
    attributes: [role, tabindex, data-value, data-selected, aria-selected, data-action]
  ComboboxEmpty:
    attributes: [hidden]
  ComboboxChipsInput:
    attributes: [type, role, aria-autocomplete, aria-label, aria-expanded, aria-haspopup, data-action]
  ComboboxChips:
    # 動的chipも同じRuby描画へ戻せるようtemplateをSSRする
    slots_mode: superset
    attributes: []
  ComboboxChip:
    slots_mode: superset
    attributes: [data-value]
progress:
  Progress:
    slots_mode: superset
    attributes: [role, aria-valuenow, aria-valuemin, aria-valuemax, style]
slider:
  Slider:
    slots_mode: superset
    attributes: [data-controller, data-orientation]
native-select:
  NativeSelect:
    # フォーム属性は利用者が <select> に渡す(name/required 等)
    attributes: [name, id, required, disabled, multiple, form, autofocus, aria-label]
input-otp:
  InputOTP:
    # Ruby版はdata-slot無しcontainer内で標準Group/Slotと実inputを合成する。
    slots_mode: superset
    attributes: [type, inputmode, pattern, maxlength, autocomplete, spellcheck, value, style, data-input-otp, data-action]
  InputOTPSlot:
    # characterとfake caretはRuby版の同期表示用内部slot。
    slots_mode: superset
    attributes: [data-index, data-active]
select:
  Select:
    # upstreamのRoot別名はDOMを持たない。Ruby版の状態ホストと
    # フォーム送信用inputは明示的な追加スロットとして許可する。
    slots_mode: superset
    attributes: [id, data-slot, data-controller, data-action, data-shadcn-generated-root-id]
  SelectTrigger:
    attributes: [type, role, aria-haspopup, aria-expanded, data-action]
  SelectContent:
    # Scroll buttonsと浮動位置のラッパーはRuby版の合成構造。
    slots_mode: superset
    attributes: [role, popover, data-state, data-closed, data-position-side, data-position-align, data-position-side-offset, data-position-align-offset, data-position-collision-padding, style]
  SelectGroup:
    attributes: [role]
  SelectItem:
    attributes: [role, tabindex, data-value, data-selected, data-action, aria-selected]
  SelectSeparator:
    attributes: [role]
  SelectScrollUpButton:
    attributes: [hidden, style, aria-hidden, data-scroll-direction, data-action]
  SelectScrollDownButton:
    attributes: [hidden, style, aria-hidden, data-scroll-direction, data-action]
field:
  FieldLabel:
    # upstream の FieldLabel は <Label>(別アイテム)を描くため、描画は label 契約の
    # クラス群を含む(field 契約側のクラスは上書き分として後勝ち)
    class_mode: contains
    attributes: [for]
input-group:
  InputGroupInput:
    # upstream は Input(別アイテム)に上書きクラスを足す
    class_mode: contains
  InputGroupTextarea:
    # upstream は Textarea(別アイテム)に上書きクラスを足す
    class_mode: contains
  InputGroupButton:
    class_mode: contains
    attributes: [type, data-size, data-action, data-state, aria-haspopup]
button-group:
  ButtonGroupSeparator:
    class_mode: contains
    attributes: [role, aria-orientation, data-slot]
direction:
  DirectionProvider:
    attributes: [dir]
sidebar:
  Sidebar:
    attributes: [data-state]
  SidebarProvider:
    attributes: [data-controller, data-state]
  SidebarTrigger:
    attributes: [type, aria-expanded, aria-label, data-action]
  SidebarRail:
    attributes: [type, tabindex, aria-label, data-action]
  SidebarInput:
    class_mode: contains
    attributes: [type, data-action, aria-invalid]
  SidebarSeparator:
    class_mode: contains
    attributes: [role, aria-orientation, data-slot, data-sidebar, data-orientation]
  SidebarMenuButton:
    attributes: [type, data-active, aria-haspopup, aria-expanded, data-action]
  SidebarMenuSkeleton:
    # 内側に Skeleton(別アイテム)を描くため子スロットが増える
    slots_mode: superset
    attributes: [data-sidebar]
  SidebarMenuAction:
    attributes: [type, aria-label, data-action]
  SidebarMenuSubButton:
    attributes: [data-active, aria-haspopup, aria-expanded]
attachment:
  AttachmentAction:
    attributes: [type, aria-label, data-action]
  AttachmentTrigger:
    attributes: [type, aria-label, data-action]
bubble:
  Bubble: {}
message: {}
message-scroller:
  MessageScroller:
    attributes: [data-controller]
  MessageScrollerViewport:
    attributes: [tabindex]
  MessageScrollerButton:
    attributes: [type, hidden, data-action]
chart:
  ChartContainer:
    attributes: []
sonner:
  Toaster:
    attributes: [data-controller, aria-live]
accordion:
  Accordion:
    # 開閉アニメーション同期のため shadcn--accordion コントローラを付ける
    attributes: [id, data-controller, data-shadcn-generated-root-id]
  AccordionItem:
    # 単独描画でも同じARIA参照とネイティブdetailsの状態同期を提供する
    attributes: [id, data-controller, data-shadcn-generated-root-id]
  AccordionTrigger:
    # details/summary方式とアイコン切替(group-aria-expanded)の状態属性。
    # base-nova のTriggerは aria-expanded を実行時にprimitiveが付与するため契約に現れない
    attributes: [aria-expanded]
calendar:
  Calendar:
    # 内側に DayButton を描く合成構造のため子スロットが増える
    slots_mode: superset
    attributes: [id, data-controller, data-action, data-shadcn-generated-root-id]
  CalendarDayButton:
    attributes: [type, tabindex, aria-label, aria-current, data-day, data-selected-single, data-today, data-outside]
